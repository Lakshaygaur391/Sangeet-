<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Sangeet Favicon Suite ── -->
  <!-- SVG (modern browsers — scales perfectly to any size) -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- PNG fallbacks for older browsers & OS dock icons -->
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
  <!-- Legacy .ico for IE / very old browsers -->
  <link rel="shortcut icon" href="/favicon.ico" />
  <!-- Apple devices: home screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- PWA manifest -->
  <link rel="manifest" href="/site.webmanifest" />

  <!-- ── Browser / OS chrome ── -->
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="msapplication-TileColor" content="#0a0a0b" />

  <!-- ── SEO ── -->
  <title>Sangeet — Discover Your Sound</title>
  <meta name="description"
    content="Sangeet is a modern music platform to discover songs, explore artists, create playlists, and enjoy music across languages and genres." />
  <meta name="keywords"
    content="Sangeet, music, songs, Indian music, Hindi songs, Punjabi songs, Haryanvi songs, Bhojpuri songs, artists, playlists, music streaming" />
  <meta name="author" content="Sangeet" />

  <!-- ── Open Graph ── -->
  <meta property="og:title" content="Sangeet — Discover Your Sound" />
  <meta property="og:description" content="Discover songs, artists, playlists, and new music with Sangeet." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sangeet" />
  <meta property="og:image" content="/apple-touch-icon.png" />

  <!-- ── Twitter / X Card ── -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Sangeet — Discover Your Sound" />
  <meta name="twitter:description" content="Discover songs, artists, playlists, and new music with Sangeet." />
  <meta name="twitter:image" content="/apple-touch-icon.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
