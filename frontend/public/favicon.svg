<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <!-- Gold gradient for the S mark -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3c869"/>
      <stop offset="55%" stop-color="#eab34a"/>
      <stop offset="100%" stop-color="#c8891f"/>
    </linearGradient>
    <!-- Subtle gold glow for waveform bars -->
    <linearGradient id="waveGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#eab34a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f3c869" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded-square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Very subtle inner vignette ring -->
  <rect width="512" height="512" rx="112" ry="112"
        fill="none" stroke="rgba(234,179,74,0.08)" stroke-width="2"/>

  <!-- ═══════════════════════════════════════════════
       "S" monogram — custom geometric construction
       Built from two arcs + a connecting spine
       ═══════════════════════════════════════════════ -->

  <!-- Top arc of S (curves right → left) -->
  <path d="
    M 190 168
    C 190 130, 220 108, 258 108
    C 296 108, 330 128, 336 162
    C 342 196, 320 218, 296 228
    L 258 240
    C 228 250, 192 268, 186 310
    C 180 352, 210 386, 256 388
    C 302 390, 336 366, 340 336
  " fill="none" stroke="url(#gold)" stroke-width="52"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner S tracing at smaller weight for definition -->
  <path d="
    M 190 168
    C 190 130, 220 108, 258 108
    C 296 108, 330 128, 336 162
    C 342 196, 320 218, 296 228
    L 258 240
    C 228 250, 192 268, 186 310
    C 180 352, 210 386, 256 388
    C 302 390, 336 366, 340 336
  " fill="none" stroke="#fde9c2" stroke-width="10"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- ═══════════════════════════════════════════════
       Audio waveform bars — 5 bars below the S,
       centred, sized to clearly read as audio meter
       ═══════════════════════════════════════════════ -->

  <!-- Bar heights (left → right): 14, 26, 38, 26, 14 -->
  <!-- Bar width: 16px  Gap: 12px  Total width: 5*16+4*12=128  Start x: (512-128)/2=192 -->

  <!-- Bar 1 — short -->
  <rect x="192" y="435" width="16" height="24" rx="8" fill="url(#waveGold)" opacity="0.55"/>
  <!-- Bar 2 — medium -->
  <rect x="220" y="421" width="16" height="38" rx="8" fill="url(#waveGold)" opacity="0.75"/>
  <!-- Bar 3 — tall (centre) -->
  <rect x="248" y="407" width="16" height="52" rx="8" fill="url(#gold)" opacity="0.95"/>
  <!-- Bar 4 — medium -->
  <rect x="276" y="421" width="16" height="38" rx="8" fill="url(#waveGold)" opacity="0.75"/>
  <!-- Bar 5 — short -->
  <rect x="304" y="435" width="16" height="24" rx="8" fill="url(#waveGold)" opacity="0.55"/>
</svg>
